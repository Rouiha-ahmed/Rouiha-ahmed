name: Refresh profile metrics

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render statistics and language chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py --user "${{ github.repository_owner }}" --out assets
          python scripts/radar.py --github "${{ github.repository_owner }}" \
            -o assets/radar-langs --title "GitHub language mix"
      - name: Commit changed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-stats-*.svg assets/radar-langs-*.svg
          git diff --staged --quiet || git commit -m "Refresh profile metrics"
          git push
